---
layout: default
title: Log in - JobTeens
---

<main class="auth-page">
  <h1>Log in</h1>
  <p>Log in to your JobTeens account.</p>

  <form id="login-form">
    <label for="login-email-input">Email</label>
    <input id="login-email-input" name="email" type="email" autocomplete="email" required>

    <label for="login-password">Password</label>
    <input id="login-password" name="password" type="password" autocomplete="current-password" required>

    <button type="submit">Log in</button>
    <p id="login-message" role="status" aria-live="polite"></p>
  </form>

  <p>Need an account? <a href="{{ '/signup.html' | relative_url }}">Sign up</a></p>
</main>
