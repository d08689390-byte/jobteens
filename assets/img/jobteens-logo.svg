<svg width="480" height="160" viewBox="0 0 480 160" xmlns="http://www.w3.org/2000/svg">
  <!-- White background -->
  <rect width="480" height="160" fill="#ffffff"/>

  <!-- Pixel-style rainbow text -->
  <text x="40" y="110"
        font-family="Verdana, Geneva, sans-serif"
        font-size="96"
        font-weight="900"
        fill="url(#rainbowGradient)"
        stroke="#000000"
        stroke-width="10"
        style="paint-order: stroke fill;
               image-rendering: pixelated;
               filter: contrast(250%) saturate(200%) brightness(110%);">
    JobTeens
  </text>

  <!-- Clean rainbow gradient (balanced, not red-heavy) -->
  <defs>
    <linearGradient id="rainbowGradient" x1="0" y1="0" x2="480" y2="0">
      <stop offset="0%" stop-color="#ff3b3b"/>
      <stop offset="20%" stop-color="#ff8c00"/>
      <stop offset="40%" stop-color="#ffe600"/>
      <stop offset="60%" stop-color="#3cff00"/>
      <stop offset="80%" stop-color="#00aaff"/>
      <stop offset="100%" stop-color="#8b00ff"/>
    </linearGradient>
  </defs>
</svg>
