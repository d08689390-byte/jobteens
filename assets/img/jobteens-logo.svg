<svg width="480" height="160" viewBox="0 0 480 160" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark retro background -->
  <rect width="480" height="160" fill="#0b0b0b"/>

  <!-- Pixel-style text -->
  <text x="40" y="110"
        font-family="Verdana, Geneva, sans-serif"
        font-size="96"
        font-weight="900"
        fill="url(#rainbowGradient)"
        stroke="#1a1a1a"
        stroke-width="10"
        style="paint-order: stroke fill;
               image-rendering: pixelated;
               filter: contrast(300%) saturate(250%) brightness(130%);">
    JobTeens
  </text>

  <!-- Rainbow gradient -->
  <defs>
    <linearGradient id="rainbowGradient" x1="0" y1="0" x2="480" y2="0">
      <stop offset="0%" stop-color="#ff004c"/>
      <stop offset="15%" stop-color="#ff7a00"/>
      <stop offset="30%" stop-color="#ffee00"/>
      <stop offset="45%" stop-color="#00ff38"/>
      <stop offset="60%" stop-color="#00c8ff"/>
      <stop offset="75%" stop-color="#2b00ff"/>
      <stop offset="100%" stop-color="#ff00e1"/>
    </linearGradient>
  </defs>
</svg>
