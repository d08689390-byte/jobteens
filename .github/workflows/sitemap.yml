name: Generate Sitemap

on:
  push:
    branches: [ main ] # Change to 'master' if that is your default branch
    paths:
      - '**.html'
      - '.github/workflows/sitemap.yml'
  workflow_dispatch: # Enables the "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  build-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate sitemap.xml
        run: |
          DOMAIN="https://jobteens.co.uk"
          
          # Explicitly delete any existing sitemap.xml
          rm -f sitemap.xml
          
          echo '<?xml version="1.0" encoding="UTF-8"?>' > sitemap.xml
          echo '<urlset xmlns="http://sitemaps.org">' >> sitemap.xml
          
          # Find all .html files, ignoring hidden folders (.*), Jekyll folders (_*), and private pages
          find . \( -path '*/.*' -o -path '*/_*' \) -prune -o \
            -name '*.html' \
            ! -name '404.html' \
            ! -name 'account.html' \
            ! -name 'employer-dashboard.html' \
            ! -name 'employer-messages.html' \
            ! -name 'forgot-password.html' \
            ! -name 'messages.html' \
            ! -name 'post-job.html' \
            ! -name 'teen-dashboard.html' \
            ! -name 'upload-cv.html' \
            -print | sort | while read -r file; do
            
            # Strip leading './' and trailing '.html'
            clean_path="${file#./}"
            clean_path="${clean_path%.html}"
            
            # Map root 'index' to the root domain, and any nested 'folder/index' to 'folder/'
            if [ "$clean_path" = "index" ]; then
              url="${DOMAIN}/"
            elif [[ "$clean_path" == */index ]]; then
              url="${DOMAIN}/${clean_path%/index}/"
            else
              url="${DOMAIN}/${clean_path}"
            fi
            
            echo "  <url>" >> sitemap.xml
            echo "    <loc>${url}</loc>" >> sitemap.xml
            echo "  </url>" >> sitemap.xml
          done
          
          echo '</urlset>' >> sitemap.xml

      - name: Commit and push sitemap.xml
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update sitemap.xml" && git push)
