name: Generate Sitemap

on:
  push:
    branches: [ main ] # Change to 'master' if that is your default branch
  workflow_dispatch: # Allows you to trigger this manually from the Actions tab

permissions:
  contents: write

jobs:
  build-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate sitemap.xml
        run: |
          DOMAIN="https://jobteens.co.uk"
          
          # Explicitly delete any existing sitemap.xml
          rm -f sitemap.xml
          
          echo '<?xml version="1.0" encoding="UTF-8"?>' > sitemap.xml
          echo '<urlset xmlns="http://sitemaps.org">' >> sitemap.xml
          
          # Find all .html files, ignoring hidden folders like .git or .github
          find . -path '*/.*' -prune -o -name '*.html' -print | sort | while read -r file; do
            # Strip leading './' and trailing '.html' for the URL string only
            clean_path="${file#./}"
            clean_path="${clean_path%.html}"
            
            echo "  <url>" >> sitemap.xml
            echo "    <loc>${DOMAIN}/${clean_path}</loc>" >> sitemap.xml
            echo "  </url>" >> sitemap.xml
          done
          
          echo '</urlset>' >> sitemap.xml

      - name: Commit and push sitemap.xml
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update sitemap.xml" && git push)
